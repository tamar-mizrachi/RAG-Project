[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-llamaindex-agentic-coding"
version = "1.0.0"
description = "RAG knowledge assistant for Agentic Coding Markdown documentation"
requires-python = ">=3.11,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
